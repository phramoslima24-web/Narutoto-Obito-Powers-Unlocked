name: Build Narutoto Obito Powers Unlocked

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check required Narutoto dependency
        run: |
          test -f libs/narutoto-0_4_1-forge.jar || {
            echo "::error::Missing libs/narutoto-0_4_1-forge.jar. Add the Narutoto 0.4.1 JAR to libs/."
            exit 1
          }

      - name: Build addon
        run: gradle --no-daemon clean build

      - name: Upload compiled addon
        uses: actions/upload-artifact@v4
        with:
          name: narutoto-obito-unlocked-1.0.0
          path: build/libs/*.jar
          if-no-files-found: error
